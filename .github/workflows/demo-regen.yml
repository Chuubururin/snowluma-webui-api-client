name: Demo Regen
on:
  push:
    paths: ['spec/openapi.yaml', 'tools/gen/**']
  workflow_dispatch:

# 这个 workflow 只负责"生成面"那一半：spec 变了 → 重出词表 → 出 PR。
# 它**不跑** npm test / npm run ui-coverage / npm run drift —— 那三条要读 vendor/upstream
# 与 generated/python|go，而两者都不入库（.gitignore），冷克隆里必然红：
# 本机实测（把 vendor 挪走后按步骤顺序跑）gen:demo ✓、typecheck:demo ✓、ui-coverage ✗（断言 2
# 解不到 Tier A 出处）、npm test ✗（5 个文件 77 条用例，全是 upstream-guards 的 ENOENT）。
# 九条离线门禁的全量链由 verify.yml 每次 push/PR 强制（冷克隆先按锚点重拉 vendor）；
# L4 活体只能本机跑：npm run verify:all -- --fixture。
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # gen:demo 的三向相等里有一腿读 generated/typescript/sdk.gen.ts，而 generated/ 不入库
      # —— 冷克隆里直接跑 gen:demo 是 ENOENT，整个 workflow 会在第一步就红，看起来像"生成器坏了"。
      - name: Generate TypeScript SDK
        run: npm run generate typescript

      - name: Regenerate demo vocabulary
        run: npm run gen:demo

      - name: Type check demo
        run: npm run typecheck:demo

      # 冷克隆可运行的完备性门禁：只读 spec、demo/parity.ts 与刚生成的词表，不碰 vendor。
      - name: Vocabulary completeness gate
        run: npx vitest run tools/check-vocabulary.test.ts

      - name: Open PR if artifacts changed
        if: success()
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: regen demo vocabulary from spec update'
          title: 'chore: regen demo vocabulary from spec update'
          body: |
            Auto-generated by demo-regen workflow.

            Triggered by changes to `spec/openapi.yaml` or `tools/gen/**`.

            只重出 `demo/vocabulary.gen.ts`。上游加一条操作后，完备性门禁会点名"这条操作没有归属"，
            人工要补的是 `demo/parity.ts` 的一条边或 `demo/declinations.ts` 的一条放弃记录 —— 不是清单文件。
          branch: auto/regen-demo
          delete-branch: true
