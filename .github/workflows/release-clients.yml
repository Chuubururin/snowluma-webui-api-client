# 派生自 SnowLuma 源码 · 非商业自用 · 不发包管理器
#
# 产物自动迭代的出口：main 上契约（锚点或 spec）一变就重发三语 SDK 工件。
# 与 verify.yml 的关系：引导步骤逐字镜像（同一工具链钉版本），区别只在最后——
# 这里 verify:all 是**发布前置条件**而不是被验对象；工件必须先过闸再出厂。
# 任何一步红都不产出 Release：宁可没有工件，不可有未过闸的工件。
name: release-clients

on:
  push:
    branches: [main]
    paths:
      - 'spec/anchor.json'
      - 'spec/openapi.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 与 verify.yml 同源的教训：runner 默认 cp1252，中文 stdout 直接崩。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/go/go.mod
          cache: true
          cache-dependency-path: adapters/go/go.sum

      - run: npm ci

      # 两条引导都调仓内脚本，因此排在 npm ci 之后（tsx 来自 node_modules）；
      # 版本只从 tools.lock.json 读。GOPATH/bin 不再手动进 GITHUB_PATH ——
      # tools/lib/go-toolchain.ts 会把 GOROOT/bin 与 <GOPATH>/bin 一并推导前置。
      - name: 引导 .venv-gen（版本取 tools.lock.json，路径按平台解析）
        run: npm run venv:bootstrap

      - name: 安装 oapi-codegen（版本取 tools.lock.json）
        run: npm run oapi:install

      - name: 恢复 vendor/upstream 缓存（按锚点 SHA 重拉）
        run: npm run fetch:upstream

      - name: 三语生成
        run: npm run generate

      - name: verify:all —— 发布前置闸
        run: npm run verify:all

      # 出口闸：源码树全绿不等于交付物可消费。发布前把三语工件真装一遍、按 package.json /
      # pyproject / go.mod 声明的入口真解析一次、示例真跑一次。任何一层红都不产出 Release。
      # 分成两步而不是一行 `a && b`：pwsh 下 `&&` 不是分隔符，串起来只会得到一条含糊的失败。
      - name: 出口闸 —— staging 合包
        run: npm run package:clients

      - name: 出口闸 —— 仓外真装、入口解析、示例执行
        run: npm run smoke:clients

      - name: 打包工件
        id: pack
        shell: pwsh
        run: |
          $anchor = (Get-Content spec/anchor.json | ConvertFrom-Json).commit
          # 锚点形状检查不信任上游一步的产物：坏 SHA 会造出读不出短前缀的 tag。
          if ($anchor -notmatch '^[0-9a-f]{40}$') { throw "anchor.commit 形状非法：$anchor" }
          # 契约版本从 spec 现读，用仓库锁定的 yaml 解析器而不是正则扫 YAML ——
          # 正则只认缩进形状，schema 里任何 `version:` 键都会把它骗过去。
          $contract = node -e "const y=require('yaml'),fs=require('fs');process.stdout.write(y.parse(fs.readFileSync('spec/openapi.yaml','utf8')).info.version)"
          if ($contract -notmatch '^\d+\.\d+\.\d+$') { throw "spec info.version 不是三段 semver 契约版本（实为 '$contract'）" }
          # pwsh 字符串展开的坑：`$(Get-Date).ToUniversalTime().ToString(…)` 里只有
          # `$(Get-Date)` 是子表达式，方法调用会留成字面文本——首跑 tag 因此带斜杠，
          # tar 打不开、Release 停在闸口（fail-closed 行为正确，无半成品出厂）。
          # UTC 时刻只承担防重复发布的职责，不表达版本语义；版本语义归 $contract。
          $tag = "clients-$contract-$($anchor.Substring(0,7))-$((Get-Date).ToUniversalTime().ToString('yyyyMMddHHmmss'))"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "contract=$contract" >> $env:GITHUB_OUTPUT
          # -Force 不是风格问题：dist/ 已经由上一步 package:clients 建出来了（它的落盘根是
          # dist/clients），而 pwsh 包装脚本前置 $ErrorActionPreference='stop'，把 New-Item
          # 对已存在目录的非终止错误升级成终止错误 —— 没有 -Force 这一步就 exit 1，
          # 后面的 Release 全部 skip（fail-closed 正确，但工件发不出去）。
          New-Item -ItemType Directory -Force dist | Out-Null
          # 打的是 staging 合包（生成码 + 行为适配层 + 规则表 + README + 示例 + metadata），
          # 不是裸 generated/：适配层出不了仓，等于把本项目那一层最关键的产物留在仓里发半成品。
          tar -czf "dist/snowluma-clients-typescript-$tag.tar.gz" -C dist/clients typescript
          tar -czf "dist/snowluma-clients-python-$tag.tar.gz" -C dist/clients python
          tar -czf "dist/snowluma-clients-go-$tag.tar.gz" -C dist/clients go
          Copy-Item spec/openapi.yaml dist/
          Copy-Item spec/anchor.json dist/
          Copy-Item spec/NOTICE.md dist/
          # 血统收据随附：generated/ 不入库，追凶"这批出自哪份 spec/哪三个 pin"全靠它。
          # 上传名刻意去掉点号：dotfile 会被 gh 改名成 default.provenance.json（验收实测）。
          Copy-Item generated/.provenance.json dist/provenance.json
          (Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          }) | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Release 正文
        shell: pwsh
        env:
          # 走 env 而不是把 ${{ }} 直接内插进脚本：GitHub 官方的注入面建议，
          # 今天这个值被上游 regex 校验过所以内插无害，但"无害"依赖的是别的步骤的正则，
          # 而不是这一行自己能看懂的东西。
          CONTRACT: ${{ steps.pack.outputs.contract }}
        run: |
          $anchor = (Get-Content spec/anchor.json | ConvertFrom-Json).commit
          $contract = $env:CONTRACT
          @"
          自动发布：main 上契约变更（锚点或 spec）。

          - 契约版本：``$contract``（真源是 spec/openapi.yaml 的 info.version；tag 里那段就是它）
          - 上游锚点：https://github.com/SnowLuma/SnowLuma/commit/$anchor
          - 工件：三语**自包含合包** tarball（生成码 + 行为适配层 + 规则表 + README + 可执行示例 + package metadata）
            + spec/openapi.yaml + spec/anchor.json + NOTICE.md + SHA256SUMS.txt + provenance.json
          - 每个工件出自同一次**先过了 verify:all 全部离线门禁、再过 smoke:clients 三层出口闸**
            （仓外真装、按声明的入口解析、示例真跑）的构建，见工作流日志。

          怎么消费：解压对应语言的 tarball 后看**它自带的 README**（安装、最小示例、出处）。
          这里不重复命令，免得多一份会漂的说明；Go 包是本地 module 工件，不走 go get。

          许可口径见 NOTICE.md：非商业自用，不发布到包管理器（npm/PyPI/Go module）；
          本仓 Release 工件属自用分发。
          "@ | Set-Content body.md -Encoding utf8

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create "${{ steps.pack.outputs.tag }}" --title "SnowLuma clients ${{ steps.pack.outputs.tag }}" --notes-file body.md -- $files
