      x-verification-status: destructive-static-only
      x-snowluma-destructive: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uin, action]
              properties:
                uin:
                  type: string
                  # 单引号保住了正则里的反斜杠；写法取 `[0-9]` 以避开 `\d` 的两层转义歧义
                  pattern: '^[0-9]{5,10}$'
                  description: 等价于 `server.ts:236` 的 UIN_REGEX
                action: { type: string, minLength: 1 }
                params:
                  type: object
                  additionalProperties: true
                  description: 各 action 自定义；本 spec 不建模（见设计口径）。缺省时服务端按 `{}` 处理（`server.ts:1304` 的 `params ?? {}`）
      responses:
        '200':
          description: |
            action 的原样返回（`server.ts:1305` 的 `c.json(result)`，无中间包装层）。
            外层是 `{status, retcode?, data?, message?, wording?}`
            （`webui/src/types.ts:404-410`），**内层 `data` 由 action 决定**，此处不约束。
