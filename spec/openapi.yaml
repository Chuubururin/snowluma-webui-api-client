    post:
      operationId: invokeDebugAction
      tags: [debug]
      summary: 把任意 OneBot action 透传执行
      description: |
        **整个 5099 面最危险的端点。** 它接受 `{uin, action, params}` 并执行
        `oneBotManager.getInstance(uin).invokeAction(action, params)` —— 也就是**业务面
        全部 action 目录**（发消息、改群、封成员）都能经此调用（设计口径）。
        范围"只做管理面"因此不是安全边界；`params` 只能是自由对象，
        生成的客户端对具体 action 参数**没有类型安全**（设计口径）。
        **不提供便利包装**：原始 body 形状本身就是文档（设计口径闸门契约）。
        **T3：绝不自动重放，且不自动重试**（`server.ts:1304` 的 await 可能已在服务端生效）。
        真实副作用＝所选 action 的副作用（缓存内不可枚举，`invokeAction` 实现在缓存外）；
        按的硬约束，T3 操作一律**不写** `x-snowluma-side-effects`，只记在本段散文里。
