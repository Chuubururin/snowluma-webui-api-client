          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebugEnvelopeFailure' }
        '401': { $ref: '#/components/responses/AuthGate401' }
        '403': { $ref: '#/components/responses/AuthGate403' }
        '404':
          description: 该 uin 不在线（`server.ts:1303`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebugEnvelopeFailure' }
