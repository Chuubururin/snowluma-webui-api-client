        订阅 `subscribeDebugEvents` 与 `observeActions`（`:1356-1359`），tap 只在
        有客户端时挂载（`:1344-1346` 注释）。慢客户端被丢弃并周期性补发 drop 标记，
        不向上游背压 —— 消费方收到 `dropped` 帧应改走 REST 重取全量。
        **Go 侧禁用本操作的 `*WithResponse` 便捷路径**（理由同 `streamLogs`；
        `WithResponse` 警告规则覆盖本操作）。
