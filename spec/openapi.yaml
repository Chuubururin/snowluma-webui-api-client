          description: 清理失败（`:183` 纯信封）/ 清理已执行但统计刷新失败（`:219-225` 附 scope/cleanup/lastCleanup 快照），同码双形合并建模（不用 oneOf：快照形是纯信封形的超集，R24 会举出证人；双形差异见本描述）
