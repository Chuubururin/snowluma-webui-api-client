      type: object
      required: [status, path, size]
      properties:
        status: { type: string, enum: [ok] }
        path: { type: string }
        # size 用 number 不用 integer：处理器 :1338 写的是 result.size，而 result 来自
        # 缓存外的 ./debug-tools（server.ts:65 导入）。缓存里唯一给这个值定性的地方是
        # webui/src/types.ts:401 的 size?: number。落盘字节数当然是整数 —— 但那是物理直觉，
        # 不是锚点（评审 Minor 2 同一条理由）。
        # 同上的 required 判定也属"构造点在缓存外"那一类（终审 W4）：path/size 两键的值来自
        # streamUploadToDisk 的返回值，该函数在缓存外 —— required: [status,path,size] 里这两项
        # 读的是 webui/src/types.ts:400-402 无 `?` 的形状证据（设计口径的兜底），不是 c.json(...)
        # 构造点；真机 schema diff 时"可选性判错"要优先复核（同 AdapterStatus 那条）。
