paths:
  /api/status:
    get:
      operationId: getStatus
      tags: [system]
      summary: 服务存活探针；顺带为仍有效的 localStorage 会话续签 avatar cookie
      x-replay-class: t1
      x-verification-status: static-only
      x-snowluma-side-effects: [cookie]
      responses:
        '200':
          description: 固定返回运行中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusInfo' }
        '401': { $ref: '#/components/responses/AuthGate401' }
  /api/auth/state:
    get:
      operationId: getAuthState
      tags: [auth]
      summary: 当前会话是否仍被要求改密（门控回环的读侧）
      x-replay-class: t1
      x-verification-status: static-only
      responses:
        '200':
          description: 改密要求状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
        '401': { $ref: '#/components/responses/AuthGate401' }
  /api/auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: 修改面板密码
      description: |
        **T3：绝不自动重放**。成功后服务端清空全部会话（`server.ts:769-775` 的注释写明理由：
        旧密码若已泄露，攻击者可能正持有当前 token），并返回 `requireRelogin: true`。
        调用方必须把它当作"这个 token 到此为止"来处理，设计口径的回环因此不是可选的礼貌步骤。
        403 只可能是 **consent 闸**那一支：`/api/auth/change-password` 在
        `MUST_CHANGE_ALLOWLIST`（`server.ts:210`）里 ⇒ `:652-653` 的"请先修改密码"对它恒不可达，
        但不在 `CONSENT_ALLOWLIST`（`:223-229` 的五条里没有它）⇒ `:645-650` 可达（裁定 N6）。
        真实副作用（记在散文里，本操作**不写** `x-snowluma-side-effects`）：
        ① `sessionTokens.clear()`（`server.ts:772`）当场作废**全部**会话，含调用方正在用的那一个；
        ② `auth.setPassword`（`server.ts:764`）把新密码落盘（`auth` 对象的实现在八个缓存文件之外，
        具体路径与写入方式未经确证）；③ `clearAvatarSessionCookie`（`server.ts:773`，
        与 logout 用的是同一个 helper）清掉 avatar cookie。
      x-replay-class: t3
      x-verification-status: static-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                两键都 required，但**缺键不会走到 400 那条"请求格式错误"**：`:744-748` 的
                try/catch 只在 body 不是合法 JSON 时触发；缺 `oldPassword` / `newPassword`
                会在 `:749-750` 被 `typeof` 兜底成空串，随后分别作为 `:751` 与 `:754` 两道检查的入参。
                两个谓词（`auth.verify` / `isStrongPassword`）由 `server.ts:41` 从 `./auth` 导入，
                实现住在八个缓存文件之外 ⇒ 缓存只证明**分支结构存在、且缺键时确实会以空串调用它们**，
                **不证明** `''` 会让 `auth.verify` 判负（⇒ 401）或让 `isStrongPassword` 判负
                （⇒ 400 带 rules）——那两个结论未经确证，别按"缺键必然落到某条错误分支"来实现客户端。
                即"两键都不得缺席"是按**能否成功**要求的（第一方客户端在 `client.ts:567` 的
                body 字面量里恒发两键），格式错误分支只覆盖非 JSON body。
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: 已改密，**全部会话失效**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChanged' }
        # 400 有三条不同文案的分支，其中"强度不足"那条**额外带 rules**（server.ts:754-758）。
        # 按状态码复用同一个 schema 会把这条信息抹平，所以在该状态码内用 oneOf 拆两个 schema。
        # 注意 oneOf 的位置：它是 **Schema Object** 的关键字，写成 Response Object 的关键字
        # 在 3.0.3 里非法，三家生成器都会当它不存在。
        '400':
          description: |
            同一状态码下的两种形状：强度不足（带 `rules`）与"新旧密码相同"/"请求格式错误"/
            "密码修改失败"（仅 `message`）。用 `oneOf` 而非合并成"全字段可选"，
            否则 `rules` 的存在性信息就没了（设计口径/设计口径）。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PasswordTooWeak'
                  - $ref: '#/components/schemas/PasswordFailure'
        '401':
          description: |
            同一状态码下的两种来源，形状不同 ⇒ 按 400 的同一条理由用 `oneOf` 拆开：
            **业务** 401 = 当前密码不正确（`server.ts:751-753`，`{success:false, message}`）；
            **门控** 401 = token 缺失/过期（中间件 `:634` 与 `:638`，`{status:'failed', message}`，
            见 `AuthGateError`）。中间件对 `/api/login` 才免检（`:631`），本路径不免检 ⇒ 门控那支
            确实可达；只写业务那支会让自适应层把"token 死了要重登"误读成"密码错了要提示用户"。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PasswordFailure'
                  - $ref: '#/components/schemas/AuthGateError'
        '403': { $ref: '#/components/responses/ConsentGate403' }
  /api/auth/check-strength:
    post:
      operationId: checkPasswordStrength
      tags: [auth]
      summary: 只判强度，不改动任何东西（回环里"先让用户试到合格"的那一步）
      description: |
        403 只可能是 consent 闸那一支：本路径在 `MUST_CHANGE_ALLOWLIST`（`server.ts:209`）
        而不在 `CONSENT_ALLOWLIST`（`:223-229`）⇒ `:652-653` 不可达、`:645-650` 可达（裁定 N6）。
        它之所以在改密白名单里，正是为了让"被强制改密"的会话能先反复试强度。
      x-replay-class: t1
      x-verification-status: static-only
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
      responses:
        '200':
          description: |
            即使请求体不是合法 JSON 也返回 200（`server.ts:736` 用空串兜底），
            所以这个端点**没有** 4xx 业务分支。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordStrength' }
        '401': { $ref: '#/components/responses/AuthGate401' }
        '403': { $ref: '#/components/responses/ConsentGate403' }
  /api/login:
    post:
      operationId: login
      tags: [auth]
      summary: 密码登录，可选第二因子（TOTP）
      description: |
        中间件对 `/api/login` 直接放行（`server.ts:631` 的 `next()`），两条闸的 401/403
        对它都不可达（裁定 N6）；本操作的 401 是处理器自己的业务分支 `LoginRejected`
        （`server.ts:689-696`），不引用任何 AuthGate 组件。
      security: []
      x-replay-class: t2
      x-verification-status: static-only
      x-snowluma-side-effects: [persist, cookie, mutate-map]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                属性集**非穷尽**：第一方客户端在带第二因子时还会发送 `recoveryCode`
                （`vendor/upstream/webui/src/lib/api/client.ts:499`），但其服务端处理在缓存
                的八个文件内不可溯源（判定在未缓存的 `webui-login.ts`），故此处刻意不列；
                不要因为"客户端没发"而反向补全，也不要贸然增补属性。
              required: [password]
              properties:
                password: { type: string }
                totp: { type: string }
      responses:
        '200':
          description: |
            成功**或**需要第二因子，二者都走 200。判别只看布尔 `success`（R22：无 discriminator）。
            `needsTotp` 分支（`server.ts:698`）**没有** `message` 字段 —— 别把它标成 required。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/LoginFormatError' }
        '401': { $ref: '#/components/responses/LoginRejected' }
        '429': { $ref: '#/components/responses/LoginLocked' }
        '500': { $ref: '#/components/responses/LoginFailed' }
  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 丢弃当前会话并清 avatar cookie
      description: |
        `/api/logout` 同时在 `MUST_CHANGE_ALLOWLIST`（`server.ts:215`）与
        `CONSENT_ALLOWLIST`（`server.ts:228`）里，两条 403 分支对它永久不可达（裁定 N6），
        故只声明门控 401。`sessionTokens.delete`（`server.ts:718`）改的是内存 map，
        不在扫描器词表的可检形状内（词表只匹配零参 `.clear()` 与 `setXxxCookie(`），
        扫描漏检、此处按源码只声明 `[cookie]`（`clearAvatarSessionCookie`，`server.ts:719`）；
        map 变更写进本段说明文字。
      x-replay-class: t2
      x-verification-status: static-only
      x-snowluma-side-effects: [cookie]
      responses:
        '200':
          description: 总是成功（token 不存在也返回 success，`server.ts:716-721`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessOnly' }
        '401': { $ref: '#/components/responses/AuthGate401' }
  /api/agreements:
    get:
      operationId: getAgreements
      tags: [agreements]
      summary: 当前协议集合与是否需要确认
      description: |
        **本操作不声明任何 403**（裁定 N6）。`/api/agreements` 同时在
        `MUST_CHANGE_ALLOWLIST`（`server.ts:213`）与 `CONSENT_ALLOWLIST`（`server.ts:226`）里，
        而全仓只有认证中间件构造 403 —— 两条闸各自 `!ALLOWLIST.has(reqPath)`
        （`:645` 与 `:652`）对它恒假 ⇒ 两支 403 永久不可达。
        它的响应体里的 `consentRequired` 才是门控的**读侧**（`consent.ts:226` 调
        `isConsentRequired()`）：客户端靠它决定要不要弹协议页，而不是靠某次 403。
        处理器 `server.ts:944` 是单行 `c.json(getAgreementsPayload())`，无任何 4xx 业务分支。
      x-replay-class: t1
      x-verification-status: static-only
      responses:
        '200':
          description: 协议载荷（`consentGatePending` 的来源）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgreementsPayload' }
        '401': { $ref: '#/components/responses/AuthGate401' }
  /api/agreements/record-consent:
    post:
      operationId: recordConsent
      tags: [agreements]
      summary: 记录操作者本人的协议同意
      description: |
        **T3：绝不自动重放**（设计口径"替操作者记录法律同意"一档）。
        它替真人做出有法律含义的表示，脚本不得代签。
        409 分支带 `currentVersion`（`server.ts:957-962`）—— 这是抓包几乎不可能覆盖的错误分支，
