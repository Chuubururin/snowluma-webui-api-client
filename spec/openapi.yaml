  /api/state/stream:
    get:
      operationId: streamState
      tags: [streams]
      summary: 进程/QQ 列表/连接状态的统一 SSE 推送
      description: |
        SSE 长连接。`EventSource` 带不了 `Authorization` 头，因此消费方必须走 fetch + reader ——
        官方客户端自己就是这么做的：入口 `client.ts:592`，其下 `openSseChannel` 在
        `client.ts:662` 另有一道**每帧 1 MiB 的客户端上限**（超了直接抛，不是服务端限制，
        生成物不会继承它，适配层要自己决定同类保护）。同一处文档注释还写明
        "畸形帧或 `onMessage` 抛错会被跳过" —— 那是**官方客户端的容忍度**，
        不是服务端保证流一定合法，适配层不得据此省掉逐帧校验。
        503 分支返回 **text/plain**，不是 JSON —— 别按 JSON 去建模它。
        401/403 走的是普通 JSON 响应：中间件 `app.use('/api/*')` 排在路由之前，SSE 也不例外，
        只有 200 才是 `text/event-stream`。
        **403 用 `AuthGate403` 而非 `ConsentGate403`**：裁定 N6 的表里 `/api/state/stream`
        两张 allowlist 都不在，所以 consent 支与改密支都可达，而 `AuthGateError` 用两个
        可选布尔把这两支并在一个信封里（设计口径），故不拆 union。
        **Go 侧禁用本操作的 `*WithResponse` 便捷路径**（终审 W5；findings Q3 当时把这条规则
        派给了客户端批次，一直没落）。oapi-codegen v2.8.0 生成的 `StreamStateWithResponse` 实测
        （types.gen.go `ParseStreamStateResponse`）是 `io.ReadAll(rsp.Body)` + `defer
        rsp.Body.Close()` —— 对长连接等于把整条流缓冲完再关闭，流当场被它杀死；且
        `StreamStateResponse` 结构里**没有 200 字段**（switch 只认 401/403 的 JSON），
        缓冲成功了也拿不到帧。流消费必须走 `Client.StreamState`（裸 `*http.Response`，
        Body 留给手写 scanner）；这与 `ui/background` 那条"没有任何生成函数消费 multipart
        类型、须走 WithBody"（findings Q2）是同一族缺口。本段说明随 operation description
        进三家生成物；`tools/validate-spec.test.ts` 钉住"200 为 text/event-stream 的操作
        description 必须提到 WithResponse"，Go 批次新增的流端点漏写即红。
      x-replay-class: t1
      x-verification-status: static-only
      x-snowluma-sse:
        heartbeatMs: 15000
        framePrefix: 'data: '
        frameSuffix: "\n\n"
        tagFields: [kind, resource]
        droppedUnderBackpressure: true
        note: >-
          心跳间隔 15000 取自 `sse-response.ts:62`（装配前置核对时才把它拉进缓存，
          在那之前，锚定清单里那条"已核实"是没有锚点撑着的），且心跳在 `start(ch)`
          之后才挂上（`sse-response.ts:61-62`）——首帧 `ready`（`server.ts:1400`）先于任何
          心跳投递；快照帧的去抖 50 ms 由调用点实参给出（`server.ts:1415`）；
          `tagFields` 是**两个**而不是一个，因为控制帧与快照帧各用不同的键区分 ——
          名字刻意不叫 `discriminatorField`：R22 之后本项目的判别一律不外泄成 discriminator 语义，
          这个字段只是给适配层看的提示，不参与任何生成器行为。
      responses:
        '200':
          description: SSE 流；每帧 `data:` 一行 JSON，形状见 `StateStreamFrame`
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StateStreamFrame' }
        '401': { $ref: '#/components/responses/AuthGate401' }
        '403': { $ref: '#/components/responses/AuthGate403' }
        '503':
          description: |
            构建未接 stateBus（`server.ts:1386-1391`，`:1390` 的
            `c.text('state stream not configured', 503)`，注释里点名的"headless mode"）。
            文本体，内容就是那句 `state stream not configured`；
            客户端应退回 REST 轮询 —— 三个 resource 各有一枚现成的 T1 端点
            （`/api/processes`、`/api/qq-list`、`/api/connections`）。
          content:
            text/plain:
              schema: { type: string }
