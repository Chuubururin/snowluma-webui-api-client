# 派生自 SnowLuma 源码 · 非商业自用 · 不发包管理器
openapi: 3.0.3
info:
  title: SnowLuma WebUI 管理面 API
  version: 0.1.0
  description: |
    派生自 SnowLuma 源码 · 非商业自用 · 不发包管理器

    本文件是契约唯一真源：操作、路径与 schema 的计数一律由 `npm run inventory` 现出，
    不写在这里（写死过一次，契约增长后描述没跟上）。`x-replay-class` 与
    `x-verification-status` 两轴的取值真源分别是 `tools/lib/tiers.ts` 的清单与
    `VERIFICATION_STATUSES`。
  license:
    name: Derived from SnowLuma (source-available, non-commercial) — private use only
servers:
  - url: http://localhost:5099
security:
  - bearer: []
tags:
  # 声明面必须覆盖使用面：每一条 operation 的 tags 都要在这里出现（tools/validate-spec.ts
  # 的 UNDECLARED_TAG 执法），否则消费端按 tag 分组时会遇到凭空出现的分组。
  - name: auth
    description: 登录与门控引导（改密、2FA 全生命周期）以及会话退出。
  - name: system
    description: 实例状态与设置、存储与清理、更新检查、TLS 证书、备份导入导出。
  - name: agreements
    description: 条款文本的读取与同意记录。
  - name: streams
    description: SSE 事件流（状态流、日志流、调试事件流）。
  - name: debug
    description: 调试文件的上传与动作调用面。
  - name: ui
    description: 界面偏好与外观配置的读写。
  - name: config
    description: 部署级全局设置与 OneBot 通道配置的读写。
  - name: onebot
    description: OneBot 进程与连接的状态、装载卸载和登录探测。
  - name: logs
    description: 日志读取、等级设置与追踪日志导出。
  - name: notifications
    description: 通知通道的配置、最近通知的读取与通道测试。
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        服务端只从 Authorization 头取 token，无 query/cookie 回退（`extractBearerToken`）。
        例外：头像代理 `/avatar/:uin` 走 path-scoped cookie（`readAvatarSessionToken`）。
  schemas:
    AuthGateError:
      type: object
      description: |
        认证/门控中间件的响应（`server.ts:626-661`）。**字段名是 `status` 不是 `success`**。
        两条 403 分支互斥：consent 闸排在改密闸之前。
      required: [status, message]
      properties:
        status:
          type: string
          enum: [failed]
        message:
          type: string
        consentRequired:
          type: boolean
        mustChangePassword:
          type: boolean
    StatusInfo:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [running]
      description: |
        线上形状是**常量** `{status:'running'}`（`server.ts:1031` 唯一 return）。
        按裁定不用 `const`，单值域写 `enum`（设计口径/R22）。
    AuthState:
      type: object
      required: [mustChangePassword]
      properties:
        mustChangePassword: { type: boolean }
    LoginSuccess:
      type: object
      description: |
        构造点唯一：`server.ts:713` 的成功 200 return
        `{ success: true, token, mustChangePassword: result.mustChangePassword }`
        —— 三字段在该字面量里恒在，故全部列入 required。
      required: [success, token, mustChangePassword]
      properties:
        success: { type: boolean, enum: [true] }
        token: { type: string }
        mustChangePassword: { type: boolean }
    LoginNeedsTotp:
      type: object
      description: |
        构造点唯一：`server.ts:698` 的 needs-totp 200 return
        `{ success: false, needsTotp: true }` —— 仅此两字段（无 message/token），required 据此。
      required: [success, needsTotp]
      properties:
        success: { type: boolean, enum: [false] }
        needsTotp: { type: boolean, enum: [true] }
    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/LoginSuccess'
        - $ref: '#/components/schemas/LoginNeedsTotp'
    SuccessFalseEnvelope:
      type: object
      description: |
        服务端在失败时实际写出的**一般业务错误形状** `{ success: false, message }`。
        构造点判据是字面形态，不是端点归属：`c.json` 字面量里 `success: false` 布尔标签
        加 `message` 字符串，两键恒在 ⇒ required。实测（锚点 commit，grep 单行样式
        `c\.json\(\{ *success: *false`）：`server.ts` 命中 72 处、`storage-routes.ts` 8 处；
        其中纯两键 68 / 8 处，其余 4 处见下方排除项。本名取代旧名 `LoginFailure`
        （终审波）—— 旧名误导：它的消费方含非 login 响应，如
        `ui/background` 的 400/413/415/500（`server.ts:1734-1759` 六处构造点）与
        `record-consent` 的 400/500 包装（`:949-951`、`:965-968`）。同形状新构造点
        凭 `success:false`+`message` 标签即可认属本信封。不归本信封、各有专名的近邻：
        200 needs-totp 分支 `LoginNeedsTotp`（`:698`，`success:false` 但**无 `message`**）、
        带 `rules` 的 `PasswordTooWeak`（`:756`）、带 `currentVersion` 的
        `ConsentVersionMismatch`（`:959`）、带 `lockedFields` 的 409（`storage-routes.ts:108-113`，
        多行构造）；另 `server.ts:1528/:1562/:1565` 在两键上多写 `saved:false, applied:false`
        （超集形状，所属端点归 Go 批次）。本信封**不**写 `additionalProperties: false`，
        上述超集支在结构上不落空。
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
    SuccessOnly:
      type: object
      description: |
        构造点：`server.ts:720` logout 处理器的 200 return `{ success: true }`
        （`:716-721` 的 handler 无条件走到这一行，恒成功）。
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
    AgreementDoc:
      type: object
      description: |
        构造点唯一：`consent.ts:170`（`loadAgreements()` 里 map 回调的唯一 return 字面量），
        五个键在该字面量里恒在 ⇒ 全部 required。`id` 的取值域来自 `consent.ts:16-19` 的
        `AGREEMENT_FILES` 字面量（只有 eula / privacy 两条）；其余四个字符串字段由
        `parseAgreementMeta()`（`:121-133`）产出，三条 `??` 兜底保证读不到文件时也是
        **空串而非缺键** ⇒ `text`/`title` 等可空但不可缺（`consent.ts:159` 的 `let text = ''`）。
        与 `webui/src/lib/api/types.ts:70-76` 的客户端声明逐键一致，此处无分歧。
      required: [id, title, declaredVersion, effectiveDate, text]
      properties:
        id: { type: string, enum: [eula, privacy] }
        title: { type: string }
        declaredVersion: { type: string }
        effectiveDate: { type: string }
        text: { type: string }
    AgreementsPayload:
      type: object
      description: |
        **required 以服务端构造点为准**：`consent.ts:226` 的
        `return { version, consentRequired: isConsentRequired(), documents: docs }` ——
        `getAgreementsPayload()` 全函数只有这一条 return，三键恒在（键集合
        `version` / `consentRequired` / `documents`）。缓存里的客户端类型
        `webui/src/lib/api/types.ts:78-84` 声明的是同样三键，故本处**无分歧**可记 ——
        但优先级仍是"`consent.ts:226` 说了算"，不是"客户端恰好猜对"（设计口径）。
        `documents` 的元素形状见 `AgreementDoc`（`consent.ts:170`）。
      required: [version, consentRequired, documents]
      properties:
        version: { type: string, description: "内容哈希版本，非日期" }
        consentRequired: { type: boolean }
        documents:
          type: array
          items: { $ref: '#/components/schemas/AgreementDoc' }
    ConsentRecorded:
      type: object
      description: |
        构造点唯一：`server.ts:971` 的 200 return `{ success: true, version }` —— 两键恒在。
        **与客户端类型的分歧（处理器为准，设计口径）**：`webui/src/lib/api/types.ts:86-91` 的
        `RecordConsentResult` 把三个分支压成一个 `{ success; message?; currentVersion? }`，
        **既没有 `version` 也不区分状态码** —— 那是客户端为了"非 2xx 也读 body"
        （`client.ts:300-315`）做的合并，不是线上形状。此处按处理器拆成
        200/400/409/500 四个形状，`version` 保留、`message` 不进入 200。
      required: [success, version]
      properties:
        success: { type: boolean, enum: [true] }
        version: { type: string }
    ConsentVersionMismatch:
      type: object
      description: |
        构造点唯一：`server.ts:958-961` 的 409 return
        `{ success: false, message, currentVersion: current }`（`current` 取自 `:954`）。
        `currentVersion` 是**必带**的：`:957` 的条件把"空串"与"版本不符"合到同一条分支，
        而该分支无条件写出这个键 ⇒ 客户端"先 GET 再 POST"的闭环有机器可读依据。
      required: [success, message, currentVersion]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        currentVersion: { type: string }
    PasswordChanged:
      type: object
      description: |
        构造点唯一：`server.ts:775` 的 200 return `{ success: true, requireRelogin: true }`
        —— 两键恒在、且两键的值都是字面量 ⇒ `enum: [true]`（按裁定不用 `const`）。
        **与客户端类型的分歧（处理器为准）**：`webui/src/lib/api/types.ts:68` 的
        `ChangePasswordResult = { success: boolean; message?: string }` **没有 `requireRelogin`**，
        `client.ts:563-574` 因此把它整体丢掉了 —— 而它正是设计口径回环的触发信号
        （`:772` 的 `sessionTokens.clear()` 已把调用方自己的 token 作废）。缺口登记交实现批次。
      required: [success, requireRelogin]
      properties:
        success: { type: boolean, enum: [true] }
        requireRelogin: { type: boolean, enum: [true] }
    PasswordFailure:
      type: object
      description: |
        构造点四处，形状相同 `{ success: false, message }`：`server.ts:747`（"请求格式错误"）、
        `:752`（"当前密码不正确"，唯一走 401 的那条）、`:761`（"新密码不得与旧密码相同"）、
        `:767`（"密码修改失败"）。两键在每条字面量里恒在 ⇒ 全部 required。
        **不含 `rules`** —— 带 `rules` 的是另一条分支 `PasswordTooWeak`（`:755-758`）。
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
      # 裁定 R23：这一行是本 schema 与上一段散文之间唯一的差别，也是散文里那句
      # "不含 rules" 能不能算事实的唯一依据。缺了它，真实的
      # `{success:false, message:'新密码不符合强度要求', rules:[…]}`（`:755-758` 的 400）
      # 会同时命中 PasswordTooWeak 与 PasswordFailure 两支，而 oneOf 的语义是"恰好一支"
      # ⇒ 合规客户端当场拒收服务端自己的正常回复。四个构造点各自只写两键，
      # 所以 additionalProperties: false 在锚点提交上是真的，且 server.ts 一改就会被漂移检查打红。
      additionalProperties: false
    PasswordTooWeak:
      type: object
      description: |
        构造点唯一：`server.ts:755-758` 的 400 return
        `{ success: false, message, rules: evaluatePasswordRules(newPassword) }` ——
        三键恒在 ⇒ `rules` 也是 required（这是它与 `PasswordFailure` 的唯一区别，
        故两者不合并，见设计口径）。
      required: [success, message, rules]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/PasswordRule' }
    PasswordStrength:
      type: object
      description: |
        构造点两处，同形状 `{ rules, valid }`：`server.ts:736`（JSON 解析失败时用空串兜底）
        与 `:739`（正常路径）—— 两条 return 都无条件写出两个键 ⇒ 两者都 required。
        **与客户端类型的分歧（处理器为准）**：`client.ts:553` 把内联响应类型写成
        `{ rules?: PasswordRule[]; valid?: boolean }`（两个可选），紧接着 `:557-559`
        又靠 `Array.isArray` + `typeof` 手工校验并抛 502 —— 那是对**传输层**的防御，
        不是"线上可以缺键"的证据；缓存的三个构造点里没有任何一条会缺键。
      required: [rules, valid]
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/PasswordRule' }
        valid: { type: boolean }
    PasswordRule:
      type: object
      description: |
        **元素形状未经确证**：`evaluatePasswordRules()` 与 `PasswordRule` 类型都在缓存的
        八个文件之外（`change-password-form` 组件里）。此处只声明"是一组对象"，
        不凭想象补字段 —— 缺什么就空着并登记进设计口径缺口（做这件事）。
        可确证的只有"它存在且被 `server.ts:736/:739/:756` 三处原样带出"：客户端
        `client.ts:2` 从 `@/components/pages/change-password-form` 导入该类型，
        而该路径不在缓存清单内 ⇒ 字段名一个都不写，连"它有几项"也无从确证（设计口径）。
      additionalProperties: true
    AdapterStatusLevel:
      type: string
      description: '`webui/src/types.ts:30` 的具名别名，五值闭集'
      enum: [ok, warn, down, disabled, degraded]
    QQInfo:
      type: object
      description: '`webui/src/types.ts:25-28`；`server.ts:1410`（SSE 支）与 `server.ts:1365`（REST 支）两处 `.map()` 字面量与之逐键相同 —— 两处都是关死的锚点'
      required: [uin, nickname]
      additionalProperties: false
      properties:
        uin: { type: string }
        nickname: { type: string }
    AdapterStatus:
      type: object
      description: |
        `webui/src/types.ts:32-39`。`lastError` / `lastErrorAt` 带 `?` ⇒ 可选，不进 required；
        这是"处理器写了什么"读不出来的那一类，只有类型侧证据（设计口径的兜底：
        真机 schema diff 时"可选性判错"是最高频问题，本条要优先复核）。
      required: [name, kind, status, detail]
      properties:
        name: { type: string }
        kind: { type: string, enum: [httpServer, httpClient, wsServer, wsClient] }
        status: { $ref: '#/components/schemas/AdapterStatusLevel' }
        detail: { type: string }
        lastError: { type: string }
        # 设计口径的裁定（终审 W2 落地，原记给 Go 批次但缺陷已在交付物里）：oapi-codegen
        # v2.8.0 把裸 number 映成 float32（types.gen.go 实测），epoch 秒 ≈1.75e9 远超 2^24
        # ⇒ ULP ≥128 秒，时间戳光靠表示就错到分钟量级，且值落进 float32 后适配层修不回来。
        lastErrorAt: { type: number, format: double }
    AccountDatabaseMigration:
      type: object
      description: |
        `webui/src/types.ts:41-49`。`total` / `progress` / `estimatedRemainingSeconds`
        在 TS 里是 `number | null` —— 3.0.3 用 `nullable: true` 表达
        （**不是** `type: [number, 'null']`，那是 3.1 的写法）。`error?: string` 可选。
      required: [phase, usable, processed, total, progress, estimatedRemainingSeconds]
      properties:
        phase: { type: string, enum: [preparing, migrating, complete, failed] }
        usable: { type: boolean }
        processed: { type: number }
        total: { type: number, nullable: true }
        progress: { type: number, nullable: true }
        estimatedRemainingSeconds: { type: number, nullable: true }
        error: { type: string }
    AccountConnections:
      type: object
      description: '`webui/src/types.ts:51-56`；`databaseMigration` 带 `?` ⇒ 可选'
      required: [uin, nickname, adapters]
      properties:
        uin: { type: string }
        nickname: { type: string }
        adapters:
          type: array
          items: { $ref: '#/components/schemas/AdapterStatus' }
        databaseMigration: { $ref: '#/components/schemas/AccountDatabaseMigration' }
    HookProcessInfo:
      type: object
      description: |
        `webui/src/types.ts:58-69`。**十个字段全无 `?`** ⇒ 全进 required，
        含 `error: string`（无错时是空串而非缺键，所以它是必带的）。
        `status` 的七值直接抄类型别名右侧，不另起 `AdapterStatusLevel` 那种具名 schema
        （它在本仓库里只是个内联联合，没有独立导出名）。
      required: [pid, name, path, injected, connected, loggedIn, uin, status, error, method]
      properties:
        pid: { type: number }
        name: { type: string }
        path: { type: string }
        injected: { type: boolean }
        connected: { type: boolean }
        loggedIn: { type: boolean }
        uin: { type: string }
        status:
          type: string
          enum: [available, loading, connecting, loaded, online, error, disconnected]
        error: { type: string }
        method: { type: string }
    StateFrameReady:
      type: object
      description: |
        构造点唯一：`server.ts:1400` 的 `send({ kind: 'ready' })` —— 只写一个键，
        故 `additionalProperties: false` 在锚点提交上为真（裁定 R23 同一条理由）。
        它是"连接已建立、下面开始来快照帧"的信号，不是数据。
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [ready] }
    StateFrameDropped:
      type: object
      description: |
        背压标记，构造点唯一：`debug-stream.ts:23` 的
        `{ kind: 'dropped', count: dropped }`，在一帧真正投递**之前**补发。
        语义是"你错过了 count 帧快照" ⇒ 消费方应当改走 REST 重新取一次全量，
        而不是把 `count` 当业务字段。`count >= 1`（攒到 0 时根本不会发这一帧，
        见 `debug-stream.ts:22` 的 `if (dropped > 0)`）。
      required: [kind, count]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [dropped] }
        count: { type: integer, minimum: 1 }
    StateFrameProcesses:
      type: object
      description: |
        `types.ts:127`。信封两键 `{resource, data}`：`data` 是 `hookManager.listProcesses()`
        的原样返回（`server.ts:1407`，未接 hookManager 时是 `[]`，`server.ts:1406`）。
        **这是"整份快照"而非增量** —— 每帧都是当时的全量，消费方直接覆盖本地状态，不做 diff 合并。
      required: [resource, data]
      # 裁定 N27（评审）：信封**不关死**。这个对象唯一的构造点在
      # `packages/core/src/webui/state-stream.ts` 的 `opts.send({ resource, data })`，
      # 而该文件按 N26 不进缓存 —— 于是"只有这两键"是一条**没有锚点撑着的正面断言**：
      # 缓存的 `StateStreamEvent` 成员是 TS 结构类型，它说"这些键以这些类型存在"，
      # 对多余键完全沉默。上游哪天加第三个键（比如 `seq`），没有任何东西会变红，
      # 而关死的形状会让真帧在 `oneOf` 上**零命中**，strict 生成物当场拒收活流量 ——
      # 这恰好是本计划允许的唯一失败方向（漏报）的反面。
      # 同批的 `HookProcessInfo` / `AccountConnections` 等四处正因为同样的理由没关死，
      # `ready`（`server.ts:1400` 的单键字面量）与 `dropped`（`debug-stream.ts:23` 的双键字面量）
      # 却因为构造点在缓存里而关得成 —— 差别不是风格，是有没有锚点。
      additionalProperties: true
      properties:
        resource: { type: string, enum: [processes] }
        data:
          type: array
          items: { $ref: '#/components/schemas/HookProcessInfo' }
    StateFrameQqList:
      type: object
      description: |
        `types.ts:128`；`server.ts:1410` 用 `.map()` 现构 `{uin, nickname}` 字面量，
        比 `QQInfo` 的实例更受限（只会写这两个键），故 `QQInfo.additionalProperties: false` 为真。
        **但这一支的信封本身仍不关死**（裁定 N27，理由逐字见 `StateFrameProcesses` 上方）：
        `server.ts:1410` 锚住的是 `data` 里那个元素，不是外面那层 `{resource, data}`。
      required: [resource, data]
      additionalProperties: true
      properties:
        resource: { type: string, enum: [qq-list] }
        data:
          type: array
          items: { $ref: '#/components/schemas/QQInfo' }
    StateFrameConnections:
      type: object
      description: '`types.ts:129`；data 来源 `server.ts:1412` 的 `getConnectionStatuses()`'
      required: [resource, data]
      # 裁定 N27：不关死，理由见 `StateFrameProcesses` 上方那段。
      additionalProperties: true
      properties:
        resource: { type: string, enum: [connections] }
        data:
          type: array
          items: { $ref: '#/components/schemas/AccountConnections' }
    StateStreamFrame:
      description: |
        `/api/state/stream` 的一帧（五支契约见 `webui/src/lib/api/types.ts:124-129` 的
        `StateStreamEvent`）。线上是 `data: <json>\n\n` —— 编码点是两处同模板：本路由的帧
        一律走 `debug-stream.ts:26`（`server.ts:1394-1398` 把 `createFramePusher` 接上
        `enqueue: ch.raw`，`:23` 的丢帧补发同一模板），`sse-response.ts:56` 的 `ch.send`
        服务的是其他 SSE 路由，本路由不经它。
        **没有 `event:` 字段** ⇒ 分派只能读负载内部，而负载上有**两个** tag 键：
        控制帧走 `kind`（`ready` / `dropped`），快照帧走 `resource`（三条）。
        按裁定 R22 不写 `discriminator`：3.0.3 上"两家可用"是假话，且本例连单 tag 都不满足，
        双 tag 的 propertyName 更表达不了。收窄由适配层做（设计口径/设计口径）。
      oneOf:
        - $ref: '#/components/schemas/StateFrameReady'
        - $ref: '#/components/schemas/StateFrameDropped'
        - $ref: '#/components/schemas/StateFrameProcesses'
        - $ref: '#/components/schemas/StateFrameQqList'
        - $ref: '#/components/schemas/StateFrameConnections'
    LogStreamReady:
      type: object
      description: |
        构造点唯一：`server.ts:1460` 的 `ch.send({ type: 'ready' })` —— 只写一个键，
        故 `additionalProperties: false`（裁定 R23，与 StateFrameReady 同一条理由）。
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ready] }
    LogStreamFrame:
      description: |
        `/api/logs/stream` 的一帧：就绪信号或一条日志。日志帧即 `LogEntry`
        （`subscribeLogs` 吐出的 entry，`server.ts:1461` 原样 `ch.send(entry)`）。
        两支以有无 `type: ready` 互斥（R22：无 discriminator；R24：LogEntry 的 required
        键集不含 `type`，`{type:ready}` 不含 LogEntry 必填键，零重叠）。
      oneOf:
        - $ref: '#/components/schemas/LogStreamReady'
        - $ref: '#/components/schemas/LogEntry'
    DebugStreamReady:
      type: object
      description: |
        构造点唯一：`server.ts:1355` 的 `send({ kind: 'ready' })` —— 只写一个键，
        故关死（裁定 R23）。
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [ready] }
    DebugStreamEvent:
      type: object
      description: |
        `server.ts:1358` 的 `send({ kind: 'event', uin, event })`。`event` 是
        `subscribeDebugEvents` 的回调入参，类型为 `JsonObject`
        （`onebot/src/instance.ts:103`）——自由对象，不发明键；信封不关死（N27）。
      required: [kind, uin, event]
      additionalProperties: true
      properties:
        kind: { type: string, enum: [event] }
        uin: { type: string }
        event:
          type: object
          description: OneBot 事件原文（JsonObject），本 spec 不建模
    DebugStreamAction:
      type: object
      description: |
        `server.ts:1359` 的 `send({ kind: 'action', uin, ...rec })`。`rec` 来自
        `observeActions`（`instance.ts:107`），其类型 `ActionObserver` 住在缓存外的
        `./api-handler` —— spread 进帧的键无锚点，故只断言 `kind`/`uin` 两键，
        信封不关死（N27）。
      required: [kind, uin]
      additionalProperties: true
      properties:
        kind: { type: string, enum: [action] }
        uin: { type: string }
    DebugStreamFrame:
      description: |
        `/api/debug/stream` 的一帧。背压丢帧标记复用 `StateFrameDropped`
        （同一套 `createFramePusher`，`server.ts:1349-1353` 与 state/stream 的
        `:1394-1398` 同模板，构造点同为 `debug-stream.ts:23`）。
        四支以 `kind` 单值互斥（R22/R24）。
      oneOf:
        - $ref: '#/components/schemas/DebugStreamReady'
        - $ref: '#/components/schemas/StateFrameDropped'
        - $ref: '#/components/schemas/DebugStreamEvent'
        - $ref: '#/components/schemas/DebugStreamAction'
